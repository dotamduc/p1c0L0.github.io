        url: "https://github.com/dotamduc"
        
      # HackMD không có icon chuẩn, dùng tạm icon 'file-code' nhìn cho hacker
      - name: "<i class='fas fa-file-code'></i> HackMD" 
        url: "https://hackmd.io/@_w5Xcz0HTuKuAJahDMj8Xw"

      - name: "<i class='fab fa-facebook'></i> Facebook"
        url: "https://www.facebook.com/ddtzzxT.07/"

      - name: "<i class='fab fa-instagram'></i> Instagram"
        url: "https://www.instagram.com/double_d_tm/"
  # Cấu hình Menu điều hướng (Navigation Bar)
