<script>
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 14;
    const columns = Math.ceil(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);
    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 255, 65, 0.15)'; ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    setInterval(draw, 35);
</script>

<canvas id="fireworks" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;"></canvas>
<script>
    
    (function() {
        if(!window.anime) {
            var script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js";
            script.onload = initFireworks;
            document.head.appendChild(script);
        } else { initFireworks(); }
    })();

    function initFireworks() {
        const fireworkCanvas = document.getElementById('fireworks');
        const fwCtx = fireworkCanvas.getContext('2d');
        let fwWidth = window.innerWidth, fwHeight = window.innerHeight;
        fireworkCanvas.width = fwWidth; fireworkCanvas.height = fwHeight;
        window.addEventListener('resize', () => { fwWidth = window.innerWidth; fwHeight = window.innerHeight; fireworkCanvas.width = fwWidth; fireworkCanvas.height = fwHeight; });
        function createParticle(x, y) {
            const p = {}; p.x = x; p.y = y; p.color = ['#00ff41', '#008F11', '#ffffff'][Math.floor(Math.random() * 3)];
            p.radius = Math.random() * 2 + 1; p.life = 100;
            const angle = Math.random() * Math.PI * 2; const velocity = Math.random() * 6 + 2;
            p.vx = Math.cos(angle) * velocity; p.vy = Math.sin(angle) * velocity;
            return p;
        }
        let particles = [];
        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            fwCtx.clearRect(0, 0, fwWidth, fwHeight);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i]; fwCtx.beginPath(); fwCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color; fwCtx.globalAlpha = p.life / 100; fwCtx.fill(); fwCtx.globalAlpha = 1;
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) { particles.splice(i, 1); i--; }
            }
        }
        animateFireworks();
        document.addEventListener('mousedown', (e) => { if(e.button === 0) for (let i = 0; i < 30; i++) particles.push(createParticle(e.clientX, e.clientY)); });
    }
</script>
