<style>
     
    #matrix-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: -9999;  
        pointer-events: none;
    }

     
    .emoji-reset {
         
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Android Emoji", sans-serif !important;
        
         
        color: initial !important; 
        
         
        background: none !important; 
        -webkit-text-fill-color: initial !important; 
        -webkit-background-clip: border-box !important;

         
        text-shadow: none !important; 
        
         
        font-style: normal !important;
        display: inline-block !important;
        font-weight: normal !important;
    }
</style>

<script>
    
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 14;
    const columns = Math.ceil(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);

    function draw() {
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        
        ctx.fillStyle = 'rgba(0, 255, 65, 0.15)'; 
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    setInterval(draw, 35);


    
    document.addEventListener("DOMContentLoaded", function() {
        
        function rescueEmojis(node) {
            
            if (node.nodeType === 3) { 
                const text = node.nodeValue;
                
                const emojiRegex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}\u{1F300}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu;
                
                if (text.match(emojiRegex)) {
                    const span = document.createElement('span');
                    
                    span.innerHTML = text.replace(emojiRegex, '<span class="emoji-reset">$&</span>');
                    node.parentNode.replaceChild(span, node);
                }
            } 
            
            else if (node.nodeType === 1 && 
                     !['SCRIPT', 'STYLE', 'TEXTAREA', 'CODE', 'PRE'].includes(node.tagName) && 
                     !node.classList.contains('emoji-reset')) {
                Array.from(node.childNodes).forEach(child => rescueEmojis(child));
            }
        }
        
        
        rescueEmojis(document.body);
    });
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>

        } else {

            mybutton.style.opacity = "0";
