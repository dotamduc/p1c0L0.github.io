<div id="three-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -9999; background: #000;"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    let scene, camera, renderer, networkGroup;
    let mouseX = 0, mouseY = 0;
    const container = document.getElementById('three-container');
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    function initThreeJS() {
        if (!container) return;
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0015);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 1000;
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        container.innerHTML = ''; 
        container.appendChild(renderer.domElement);
        networkGroup = new THREE.Group();
        scene.add(networkGroup);
        
        const geometry = new THREE.BoxGeometry(40, 40, 40);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        
        for (let i = 0; i < 200; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = (Math.random() - 0.5) * 2000;
            mesh.position.y = (Math.random() - 0.5) * 2000;
            mesh.position.z = (Math.random() - 0.5) * 2000;
            mesh.rotation.x = Math.random() * 2 * Math.PI;
            mesh.rotation.y = Math.random() * 2 * Math.PI;
            mesh.scale.set(Math.random() * 2 + 0.5, Math.random() * 2 + 0.5, Math.random() * 2 + 0.5);
            networkGroup.add(mesh);
        }

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff41, transparent: true, opacity: 0.2 });
        const lineGeometry = new THREE.BufferGeometry();
        const positions = [];
        const blocks = networkGroup.children;

        for (let i = 0; i < blocks.length; i++) {
            for (let j = i + 1; j < blocks.length; j++) {
                const dist = blocks[i].position.distanceTo(blocks[j].position);
                if (dist < 300) {
                    positions.push(blocks[i].position.x, blocks[i].position.y, blocks[i].position.z);
                    positions.push(blocks[j].position.x, blocks[j].position.y, blocks[j].position.z);
                }
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        networkGroup.add(lines);

        document.addEventListener('mousemove', onDocumentMouseMove, false);
        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
    function onDocumentMouseMove(event) { mouseX = (event.clientX - windowHalfX) * 0.5; mouseY = (event.clientY - windowHalfY) * 0.5; }
    function animateThreeJS() { requestAnimationFrame(animateThreeJS); render(); }
    function render() {
        const time = Date.now() * 0.0005;
        camera.position.x += (mouseX - camera.position.x) * 0.05;
        camera.position.y += (-mouseY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
        networkGroup.rotation.x = time * 0.2;
        networkGroup.rotation.y = time * 0.3;
        renderer.render(scene, camera);
    }
    
    if(!window.threeInitialized) { initThreeJS(); animateThreeJS(); window.threeInitialized = true; }
</script>

<div id="hackmd-toc-wrapper" style="display: none;">
    <div class="toc-header">:: TABLE OF CONTENTS ::</div>
    <div id="hackmd-toc-content"></div>
</div>

<script>
    function goBack() {
        // Kiểm tra lịch sử duyệt web
        if (window.history.length > 1 && document.referrer.indexOf(window.location.host) !== -1) {
            window.history.back();
        } else { 
            // FIX LỖI 404: Sử dụng BaseURL của Hugo thay vì '/'
            window.location.href = '{{ .Site.BaseURL }}'; 
        }
    }

    function generateHackMDTOC() {
        const tocWrapper = document.getElementById('hackmd-toc-wrapper');
        const tocContent = document.getElementById('hackmd-toc-content');
        const backBtn = document.getElementById('cyber-back-btn');
        const postContent = document.querySelector('.post-content');

        if(tocContent) tocContent.innerHTML = '';
        if(tocWrapper) tocWrapper.style.display = 'none';
        if(backBtn) backBtn.style.display = 'none';

        if (postContent && tocContent) {
            backBtn.style.display = 'block';
            const headings = postContent.querySelectorAll('h1, h2, h3, h4');
            if (headings.length > 0) {
                tocWrapper.style.display = 'block';
                const ul = document.createElement('ul');
                headings.forEach((heading) => {
                    let id = heading.getAttribute('id');
                    if (!id) { id = heading.innerText.toLowerCase().replace(/[^\w]+/g, '-'); heading.setAttribute('id', id); }
                    const li = document.createElement('li');
                    const level = heading.tagName.toLowerCase();
                    li.className = `toc-item ${level}`;
                    const a = document.createElement('a');
                    a.href = `#${id}`; a.innerText = heading.innerText; a.className = 'toc-link';
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const target = document.getElementById(id);
                        if(target) {
                            const offsetPosition = target.getBoundingClientRect().top + window.pageYOffset - 100;
                            window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                            history.pushState(null, null, `#${id}`);
                        }
                    });
                    li.appendChild(a); ul.appendChild(li);
                });
                tocContent.appendChild(ul);
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const id = entry.target.getAttribute('id');
                            document.querySelectorAll('.toc-link').forEach(link => link.classList.remove('active'));
                            const activeLink = document.querySelector(`.toc-link[href="#${id}"]`);
                            if (activeLink) { activeLink.classList.add('active'); activeLink.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
                        }
                    });
                }, { rootMargin: '-100px 0px -70% 0px' });
                headings.forEach(heading => observer.observe(heading));
            }
        }
    }
</script>

<script>
    function initCodeCopy() {
        const codeBlocks = document.querySelectorAll('.highlight');
        codeBlocks.forEach(block => {
            if (block.querySelector('.cyber-copy-btn')) return;
            if (getComputedStyle(block).position === 'static') block.style.position = 'relative';
            const btn = document.createElement('button');
            btn.className = 'cyber-copy-btn';
            btn.innerHTML = '<span>COPY</span>'; 
            btn.addEventListener('click', () => {
                const clone = block.cloneNode(true);
                const lineNums = clone.querySelectorAll('.ln, .lnt, .lntd:first-child');
                lineNums.forEach(el => el.remove());
                const codeText = clone.innerText.trim();
                navigator.clipboard.writeText(codeText).then(() => {
                    btn.innerHTML = '<span style="color:#fff">COPIED!</span>';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.innerHTML = '<span>COPY</span>'; btn.classList.remove('copied'); }, 2000);
                });
            });
            block.appendChild(btn);
        });
    }
</script>

<script>
    function initStatusBar() {
        if (document.getElementById('system-status-bar')) return;
        const header = document.querySelector('.header') || document.querySelector('header');
        if (header) {
            const statusBar = document.createElement('div');
            statusBar.id = 'system-status-bar';
            statusBar.innerHTML = `<div class="status-content"><div class="status-item"><span class="label">SYSTEM:</span> <span class="value">ONLINE</span></div><div class="status-clock"><span id="sb-hour">00</span><span class="blink">:</span><span id="sb-min">00</span><span class="blink">:</span><span id="sb-sec">00</span></div><div class="status-item"><span class="label">DATE:</span> <span class="value" id="sb-date">LOADING...</span></div></div>`;
            header.parentNode.insertBefore(statusBar, header.nextSibling);
            function updateTime() {
                const now = new Date();
                const hEl = document.getElementById('sb-hour'), mEl = document.getElementById('sb-min'), sEl = document.getElementById('sb-sec'), dEl = document.getElementById('sb-date');
                if(hEl) { hEl.innerText = String(now.getHours()).padStart(2, '0'); mEl.innerText = String(now.getMinutes()).padStart(2, '0'); sEl.innerText = String(now.getSeconds()).padStart(2, '0'); }
                if(dEl) { dEl.innerText = now.toLocaleDateString('en-CA'); }
            }
            setInterval(updateTime, 1000); updateTime();
        }
    }
</script>
