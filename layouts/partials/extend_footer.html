<canvas id="matrix-bg"></canvas>

<script>
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    // Hàm chỉnh kích thước canvas full màn hình
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 14;
    const columns = Math.ceil(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);

    // CẤU HÌNH MÀU SẮC
    const themes = {
        light: {
            bgFade: 'rgba(244, 244, 244, 0.2)', // Màu nền trắng mờ (Light)
            text: '#000080' // Chữ Navy
        },
        dark: {
            bgFade: 'rgba(0, 0, 0, 0.1)', // Màu nền đen mờ (Dark)
            text: '#00ff41' // Chữ Xanh lá
        }
    };

    function draw() {
        // Kiểm tra trực tiếp xem body có class 'dark' không
        const isDark = document.body.classList.contains('dark');
        const theme = isDark ? themes.dark : themes.light;

        // Vẽ lớp phủ mờ để tạo hiệu ứng đuôi dài
        ctx.fillStyle = theme.bgFade;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Thiết lập màu chữ
        ctx.fillStyle = theme.text;
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    // Chạy vòng lặp vẽ (35ms/khung hình)
    setInterval(draw, 35);
</script>
