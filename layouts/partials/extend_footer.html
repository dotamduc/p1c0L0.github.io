<canvas id="matrix-bg"></canvas>
<style>
    /* 1. Cấu hình nền Matrix */
    #matrix-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: -9999; /* Luôn nằm dưới cùng */
        pointer-events: none;
    }

    /* 2. Cấu hình CLASS CỨU HỘ EMOJI (Tránh bị font Hacker làm lỗi icon) */
    .emoji-reset {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Android Emoji", sans-serif !important;
        color: initial !important; 
        background: none !important; 
        -webkit-text-fill-color: initial !important; 
        -webkit-background-clip: border-box !important;
        text-shadow: none !important; 
        font-style: normal !important;
        display: inline-block !important;
        font-weight: normal !important;
    }
</style>
<script>
    // --- MATRIX RAIN SCRIPT ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 14;
    const columns = Math.ceil(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 255, 65, 0.15)'; 
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    setInterval(draw, 35);

    // --- SCRIPT TỰ ĐỘNG TÌM VÀ SỬA EMOJI ---
    document.addEventListener("DOMContentLoaded", function() {
        function rescueEmojis(node) {
            if (node.nodeType === 3) { 
                const text = node.nodeValue;
                const emojiRegex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}\u{1F300}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu;
                if (text.match(emojiRegex)) {
                    const span = document.createElement('span');
                    span.innerHTML = text.replace(emojiRegex, '<span class="emoji-reset">$&</span>');
                    node.parentNode.replaceChild(span, node);
                }
            } 
            else if (node.nodeType === 1 && !['SCRIPT', 'STYLE', 'TEXTAREA', 'CODE', 'PRE'].includes(node.tagName) && !node.classList.contains('emoji-reset')) {
                Array.from(node.childNodes).forEach(child => rescueEmojis(child));
            }
        }
        rescueEmojis(document.body);
    });
</script>


<canvas id="fireworks" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;"></canvas>
<script>
    // Tự động load thư viện anime.js
    (function() {
        if(!window.anime) {
            var script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js";
            script.onload = initFireworks;
            document.head.appendChild(script);
        } else { initFireworks(); }
    })();

    function initFireworks() {
        const fireworkCanvas = document.getElementById('fireworks');
        const fwCtx = fireworkCanvas.getContext('2d');
        let fwWidth = window.innerWidth;
        let fwHeight = window.innerHeight;
        fireworkCanvas.width = fwWidth;
        fireworkCanvas.height = fwHeight;

        window.addEventListener('resize', () => {
            fwWidth = window.innerWidth;
            fwHeight = window.innerHeight;
            fireworkCanvas.width = fwWidth;
            fireworkCanvas.height = fwHeight;
        });

        function createParticle(x, y) {
            const particle = {};
            particle.x = x;
            particle.y = y;
            const colors = ['#00ff41', '#008F11', '#ffffff'];
            particle.color = colors[Math.floor(Math.random() * colors.length)];
            particle.radius = Math.random() * 2 + 1;
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 6 + 2;
            particle.vx = Math.cos(angle) * velocity;
            particle.vy = Math.sin(angle) * velocity;
            particle.life = 100; 
            return particle;
        }

        let particles = [];

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            fwCtx.clearRect(0, 0, fwWidth, fwHeight);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                fwCtx.fillStyle = p.color;
                fwCtx.globalAlpha = p.life / 100;
                fwCtx.fill();
                fwCtx.globalAlpha = 1;
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }
        animateFireworks();

        document.addEventListener('mousedown', (e) => {
            if(e.button === 0) { 
                for (let i = 0; i < 30; i++) {
                    particles.push(createParticle(e.clientX, e.clientY));
                }
            }
        });
    }
</script>


<script src="https://cdn.jsdelivr.net/npm/pjax/pjax.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>

<div id="aplayer-fixed" class="hacker-player"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Khởi tạo PJAX
        var pjax = new Pjax({
            selectors: [
                "title", 
                "meta[name=description]", 
                "main", // Chỉ thay đổi phần nội dung chính
            ],
            cacheBust: false
        });

        // 2. Khởi tạo APlayer (Chỉ 1 lần duy nhất)
        if (!window.ap) {
            window.ap = new APlayer({
                container: document.getElementById('aplayer-fixed'),
                fixed: true,
                autoplay: true,
                theme: '#00ff41',
                loop: 'all',
                order: 'list',
                preload: 'auto',
                volume: 0.5,
                mutex: true,
                listFolded: true,
                audio: [
                    // --- DANH SÁCH BÀI HÁT ---
                    {
                        name: 'Người tình mùa đông',
                        artist: 'Hà Anh Tuấn',
                        url: 'music/nhac.mp3', // Đảm bảo file nhạc nằm trong thư mục static/music/
                        cover: 'images/cover.png'
                    },
                    // Bạn có thể thêm bài hát khác tại đây
                ]
            });

            // Autoplay hack
            document.body.addEventListener('click', function() {
                window.ap.play();
            }, { once: true });
        }
        
        // 3. Khởi tạo Đồng hồ ngay khi trang load
        initCyberClock();
    });

    // QUAN TRỌNG: Khi chuyển trang bằng PJAX, đồng hồ có thể bị mất nếu header bị reload
    // Đoạn này đảm bảo đồng hồ luôn được tạo lại sau khi chuyển trang
    document.addEventListener('pjax:complete', function() {
        initCyberClock();
    });
</script>

<script>
    function initCyberClock() {
        // Kiểm tra xem đồng hồ đã tồn tại chưa để tránh tạo trùng
        if (document.getElementById('cyber-clock-container')) return;

        // Tìm vị trí menu trong PaperMod (class .nav hoặc thẻ nav)
        const navMenu = document.querySelector('.nav') || document.querySelector('nav');
        
        if (navMenu) {
            // Tạo phần tử đồng hồ
            const clockDiv = document.createElement('div');
            clockDiv.id = 'cyber-clock-container';
            clockDiv.innerHTML = `
                <div class="cyber-time">
                    <span id="cyber-hours">00</span><span class="blink">:</span><span id="cyber-minutes">00</span><span class="blink">:</span><span id="cyber-seconds">00</span>
                </div>
                <div class="cyber-date" id="cyber-date">YYYY-MM-DD</div>
            `;
            
            // Chèn vào cuối thanh menu (bên dưới các nút nhờ CSS width: 100%)
            navMenu.appendChild(clockDiv);
            
            // Hàm cập nhật giờ
            function updateTime() {
                const now = new Date();
                
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                
                const hEl = document.getElementById('cyber-hours');
                const mEl = document.getElementById('cyber-minutes');
                const sEl = document.getElementById('cyber-seconds');
                const dEl = document.getElementById('cyber-date');
                
                if(hEl && mEl && sEl && dEl) {
                    hEl.innerText = h;
                    mEl.innerText = m;
                    sEl.innerText = s;
                    dEl.innerText = `-- ${year}-${month}-${day} --`;
                }
            }
            
            setInterval(updateTime, 1000);
            updateTime(); // Chạy ngay lập tức
        }
    }
</script>

<style>
    /* CSS cho Đồng hồ */
    #cyber-clock-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 15px;
        padding: 5px;
        font-family: 'Courier New', monospace;
        color: #00ff41;
        text-shadow: 0 0 5px #00ff41;
        border-top: 1px dashed rgba(0, 255, 65, 0.3);
        
        /* QUAN TRỌNG: width 100% để ép nó xuống dòng trong Flexbox của Header */
        width: 100%; 
        order: 999; /* Đảm bảo nằm cuối cùng */
    }

    .cyber-time {
        font-size: 2.5em;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .cyber-date {
        font-size: 1.5em;
        opacity: 0.8;
        letter-spacing: 1px;
    }

    /* Hiệu ứng nhấp nháy dấu hai chấm */
    .blink {
        animation: blink-anim 1s infinite;
    }

    @keyframes blink-anim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
    
    /* Ẩn trên mobile nếu màn hình quá bé */
    @media screen and (max-width: 480px) {
        #cyber-clock-container {
            font-size: 0.8em;
        }
    }
</style>
