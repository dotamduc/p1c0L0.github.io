<canvas id="matrix-bg"></canvas>
<style>
    #matrix-bg {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: -9999; pointer-events: none;
    }
    /* Class để reset màu cho Emoji */
    .emoji-reset {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif !important;
        color: initial !important;
        text-shadow: none !important;
        font-style: normal !important;
        filter: none !important;
        display: inline-block;
    }
</style>

<script>
    // --- PHẦN 1: MATRIX RAIN SCRIPT (Giữ nguyên) ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 14;
    const columns = Math.ceil(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);
    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 255, 65, 0.15)'; // Màu xanh mờ
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    // Vẽ nền đen ban đầu
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    setInterval(draw, 35);

    // --- PHẦN 2: EMOJI RESCUE SCRIPT (SCRIPT CỨU HỘ ICON) ---
    // Tự động tìm và trả lại màu gốc cho Emoji
    document.addEventListener("DOMContentLoaded", function() {
        const contentArea = document.querySelector('body'); // Quét toàn bộ body
        
        // Regex nhận diện Emoji
        const emojiRegex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu;

        function rescueEmojis(node) {
            // Chỉ xử lý các nút văn bản (Text Nodes), bỏ qua thẻ script/style
            if (node.nodeType === 3) { 
                const text = node.nodeValue;
                // Nếu tìm thấy Emoji trong đoạn văn bản
                if (text.match(emojiRegex)) {
                    const span = document.createElement('span');
                    // Bao bọc Emoji bằng thẻ span có class .emoji-reset
                    span.innerHTML = text.replace(emojiRegex, '<span class="emoji-reset">$&</span>');
                    node.parentNode.replaceChild(span, node);
                }
            } else if (node.nodeType === 1 && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE' && node.tagName !== 'TEXTAREA' && !node.classList.contains('emoji-reset')) {
                // Đệ quy để tìm sâu vào các thẻ con
                Array.from(node.childNodes).forEach(child => rescueEmojis(child));
            }
        }
        
        rescueEmojis(contentArea);
    });
</script>
