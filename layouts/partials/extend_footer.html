<canvas id="network-canvas"></canvas>
<style>
    #network-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -9999; background-color: #000000; }
</style>
<script>
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const particles = [];
    const config = { particleCount: 100, connectionDist: 150, color: '#00ff41', baseSpeed: 0.5, glow: 15 };
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class Particle {
        constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.vx = (Math.random() - 0.5) * config.baseSpeed; this.vy = (Math.random() - 0.5) * config.baseSpeed; this.size = Math.random() * 2 + 1; }
        update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > w) this.vx *= -1; if (this.y < 0 || this.y > h) this.vy *= -1; }
        draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = config.color; ctx.shadowBlur = config.glow; ctx.shadowColor = config.color; ctx.fill(); ctx.shadowBlur = 0; }
    }
    function init() { particles.length = 0; for (let i = 0; i < config.particleCount; i++) { particles.push(new Particle()); } }
    function animate() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
            let p1 = particles[i]; p1.update(); p1.draw();
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dx = p1.x - p2.x; let dy = p1.y - p2.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < config.connectionDist) {
                    ctx.beginPath();
                    let alpha = 1 - (dist / config.connectionDist);
                    ctx.strokeStyle = `rgba(0, 255, 65, ${alpha})`; ctx.lineWidth = 0.8; ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }
    init(); animate();
</script>

<script>
    function initStatusBar() {
        // Kiểm tra nếu đã có thanh status thì không tạo lại
        if (document.getElementById('system-status-bar')) return;
        
        // Tìm phần Header của PaperMod
        const header = document.querySelector('.header') || document.querySelector('header');
        
        if (header) {
            // Tạo thanh Status Bar mới
            const statusBar = document.createElement('div');
            statusBar.id = 'system-status-bar';
            statusBar.innerHTML = `
                <div class="status-content">
                    <div class="status-item">
                        <span class="label">SYSTEM:</span> <span class="value">ONLINE</span>
                    </div>
                    
                    <div class="status-clock">
                        <span id="sb-hour">00</span><span class="blink">:</span><span id="sb-min">00</span><span class="blink">:</span><span id="sb-sec">00</span>
                    </div>
                    
                    <div class="status-item">
                        <span class="label">DATE:</span> <span class="value" id="sb-date">LOADING...</span>
                    </div>
                </div>
            `;
            
            // Chèn thanh này ngay SAU Header (Tách biệt hoàn toàn)
            header.parentNode.insertBefore(statusBar, header.nextSibling);
            
            // Hàm cập nhật giờ
            function updateTime() {
                const now = new Date();
                
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                
                const hEl = document.getElementById('sb-hour');
                const mEl = document.getElementById('sb-min');
                const sEl = document.getElementById('sb-sec');
                const dEl = document.getElementById('sb-date');
                
                if(hEl) {
                    hEl.innerText = h;
                    mEl.innerText = m;
                    sEl.innerText = s;
                }
                
                if(dEl) {
                    // Format: YYYY-MM-DD (Chuẩn Hacker)
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    dEl.innerText = `${year}-${month}-${day}`;
                }
            }
            setInterval(updateTime, 1000); updateTime();
        }
    }
</script>

<style>
    /* CSS CHO THANH TRẠNG THÁI RIÊNG */
    #system-status-bar {
        width: 100%;
        background-color: rgba(0, 10, 0, 0.8); /* Nền đen mờ tách biệt */
        border-bottom: 1px solid #00ff41; /* Đường kẻ xanh ngăn cách */
        border-top: 1px solid rgba(0, 255, 65, 0.2);
        padding: 10px 0;
        margin-bottom: 30px; /* Cách nội dung bên dưới một khoảng */
        font-family: 'Courier New', monospace;
        backdrop-filter: blur(5px);
        position: relative;
        z-index: 99;
    }

    .status-content {
        max-width: 1200px; /* Canh giữa theo độ rộng web */
        margin: 0 auto;
        display: flex;
        justify-content: space-between; /* Dàn đều 3 phần: Trái - Giữa - Phải */
        align-items: center;
        padding: 0 20px;
    }

    /* Phần Label nhỏ 2 bên */
    .status-item {
        font-size: 0.9rem;
        color: #00ff41;
        opacity: 0.8;
    }
    .status-item .label {
        font-weight: bold;
        color: #fff;
    }

    /* Phần Đồng hồ ở giữa (To và Nổi bật) */
    .status-clock {
        font-size: 1.8rem;
        font-weight: 800;
        color: #00ff41;
        text-shadow: 0 0 15px rgba(0, 255, 65, 0.6);
        letter-spacing: 3px;
        background: rgba(0, 255, 65, 0.05); /* Nền nhẹ làm nổi bật giờ */
        padding: 5px 20px;
        border-radius: 5px;
        border: 1px dashed rgba(0, 255, 65, 0.3);
    }

    .blink {
        animation: blink-anim 1s infinite;
    }

    @keyframes blink-anim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
    }

    /* Responsive cho điện thoại */
    @media screen and (max-width: 768px) {
        .status-content {
            flex-direction: column; /* Xếp dọc trên mobile */
            gap: 5px;
        }
        .status-clock {
            font-size: 1.4rem;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .status-item {
            font-size: 0.8rem;
        }
    }
</style>

<div id="aplayer-fixed"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        var pjax = new Pjax({ selectors: ["title", "meta[name=description]", "main"], cacheBust: false });
        if (!window.ap) {
            window.ap = new APlayer({
                container: document.getElementById('aplayer-fixed'), fixed: true, autoplay: true, theme: '#00ff41', loop: 'all', order: 'list', preload: 'auto', volume: 0.5, mutex: true, listFolded: true,
                audio: [ { name: 'Cyberpunk City', artist: 'Hacker', url: '/music/song.mp3', cover: '/images/cover.jpg' } ]
            });
            document.body.addEventListener('click', function() { window.ap.play(); }, { once: true });
        }
        initStatusBar(); // Gọi hàm tạo Status Bar
    });
    document.addEventListener('pjax:complete', function() { initStatusBar(); });
</script>
